<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CALCIFY — Smart Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">
  <div class="app-header">
    <div class="brand">
      <span class="logo-icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="3" y="2" width="18" height="20" rx="3" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="1.6"/>
          <rect x="6.5" y="5" width="11" height="4.2" rx="1" fill="currentColor"/>
          <circle cx="7.6" cy="13" r="1.15" fill="currentColor"/>
          <circle cx="12" cy="13" r="1.15" fill="currentColor"/>
          <circle cx="16.4" cy="13" r="1.15" fill="currentColor"/>
          <circle cx="7.6" cy="17" r="1.15" fill="currentColor"/>
          <circle cx="12" cy="17" r="1.15" fill="currentColor"/>
          <circle cx="16.4" cy="17" r="1.15" fill="currentColor"/>
        </svg>
      </span>
      <div class="brand-text">
        <h1>CALCIFY</h1>
        <span>Smart • Fast • Simple</span>
      </div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="historyToggle" aria-label="Toggle history">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="13" r="8" stroke="currentColor" stroke-width="1.7"/>
          <path d="M12 9v4l2.5 1.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M9 3.5C7.2 4.2 5.7 5.4 4.7 7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
      </button>
      <button class="icon-btn" id="themeToggle" aria-label="Toggle theme">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5Z" fill="currentColor"/>
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:none">
          <circle cx="12" cy="12" r="4.2" fill="currentColor"/>
          <g stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
            <path d="M12 2.5v2.2"/><path d="M12 19.3v2.2"/>
            <path d="M4.2 4.2l1.6 1.6"/><path d="M18.2 18.2l1.6 1.6"/>
            <path d="M2.5 12h2.2"/><path d="M19.3 12h2.2"/>
            <path d="M4.2 19.8l1.6-1.6"/><path d="M18.2 5.8l1.6-1.6"/>
          </g>
        </svg>
      </button>
    </div>
  </div>

  <div class="calculator">
    <div class="display">
      <div class="expression" id="expression"></div>
      <div class="result" id="result">0</div>
    </div>

    <div class="buttons">
      <button class="btn function" data-action="clear">AC</button>
      <button class="btn function" data-action="negate">+/-</button>
      <button class="btn function" data-action="percent">%</button>
      <button class="btn operator" data-action="divide">÷</button>

      <button class="btn number" data-value="7">7</button>
      <button class="btn number" data-value="8">8</button>
      <button class="btn number" data-value="9">9</button>
      <button class="btn operator" data-action="multiply">×</button>

      <button class="btn number" data-value="4">4</button>
      <button class="btn number" data-value="5">5</button>
      <button class="btn number" data-value="6">6</button>
      <button class="btn operator" data-action="subtract">−</button>

      <button class="btn number" data-value="1">1</button>
      <button class="btn number" data-value="2">2</button>
      <button class="btn number" data-value="3">3</button>
      <button class="btn operator" data-action="add">+</button>

      <button class="btn number zero" data-value="0">0</button>
      <button class="btn number" data-value=".">.</button>
      <button class="btn operator equals" data-action="equals">=</button>
    </div>
  </div>
</div>

<div class="drawer-overlay" id="drawerOverlay"></div>
<aside class="history-drawer" id="historyDrawer">
  <div class="history-drawer-header">
    <h2>Calculation History</h2>
    <button class="icon-btn small" id="closeHistory" aria-label="Close history">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
  <ul id="historyList"></ul>
  <p class="history-empty" id="historyEmpty">No calculations yet.</p>
  <button class="clear-history-btn" id="clearHistory">Clear History</button>
</aside>

<script src="script.js"></script>
</body>
</html>
